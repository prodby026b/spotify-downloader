name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            name: prodby026b-Spotify-Downloader-Windows.exe
          - os: macos-latest
            name: prodby026b-Spotify-Downloader-macOS
          - os: ubuntu-latest
            name: prodby026b-Spotify-Downloader-Linux

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Executable
        run: |
          pyinstaller --noconsole --onefile --name "${{ matrix.name }}" spotify_dl.py

      - name: Upload binaries to release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
            files: dist/*
        env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
